<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Switch shopping app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Switch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Switch</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Maps for Flutter web (key loaded from local maps_api_key.js). -->
  <script src="maps_api_key.js"></script>
  <script>
    (function () {
      var key = String(window.GOOGLE_MAPS_API_KEY || "").trim();
      if (!key || key === "YOUR_GOOGLE_MAPS_API_KEY") return;
      var script = document.createElement("script");
      script.src =
        "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key);
      script.async = true;
      document.head.appendChild(script);
    })();
  </script>
  <style>
    /* Keep Flutter search fields from showing a native browser outline
       that looks like a second bordered box around only the text. */
    input,
    textarea,
    flt-semantics input,
    flt-semantics textarea {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
