<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Sign Up</title>
    <link rel="stylesheet" href="/styles.css?v=universal-search-1" />
  </head>
  <body class="admin-signup-page">
    <main class="page-shell admin-signup-public-shell">
      <header class="admin-signup-public-nav">
        <a href="/web_immersive.html" class="admin-signup-public-brand">GMS Shopping</a>
        <a href="/login.html?role=admin" class="admin-signup-public-login">Log in</a>
      </header>

      <section class="admin-signup-public-layout" aria-labelledby="admin-signup-title">
        <div class="admin-signup-public-copy">
          <p class="eyebrow">Seller Workspace</p>
          <h1 id="admin-signup-title">Create Admin Account</h1>
          <p>
            Set up the company workspace, then sign in as admin to manage products,
            inventory, employees, orders, and customer operations.
          </p>
        </div>

        <section class="panel admin-signup-public-panel">
          <form class="product-form admin-signup-public-form" id="admin-signup-form" novalidate>
            <label>
              <span>Company Name</span>
              <input name="companyName" type="text" autocomplete="organization" required />
            </label>

            <label>
              <span>Store Type</span>
              <select
                name="storeType"
                class="admin-signup-public-select"
                id="admin-signup-store-type"
                required
              >
                <option value="">Loading store types...</option>
              </select>
            </label>

            <div class="admin-signup-public-row">
              <label>
                <span>First Name</span>
                <input name="firstName" type="text" autocomplete="given-name" required />
              </label>
              <label>
                <span>Last Name</span>
                <input name="lastName" type="text" autocomplete="family-name" required />
              </label>
            </div>

            <label>
              <span>Email</span>
              <input name="email" type="email" autocomplete="email" required />
            </label>

            <label>
              <span>Mobile Number</span>
              <div class="admin-signup-public-phone">
                <span>+63</span>
                <input
                  name="mobileNumber"
                  type="tel"
                  inputmode="numeric"
                  autocomplete="tel-national"
                  placeholder="9XXXXXXXXX"
                  required
                />
              </div>
            </label>

            <div class="admin-signup-public-row">
              <label>
                <span>Password</span>
                <input name="password" type="password" autocomplete="new-password" required />
              </label>
              <label>
                <span>Confirm</span>
                <input name="confirmPassword" type="password" autocomplete="new-password" required />
              </label>
            </div>

            <button type="submit" class="login-submit admin-signup-public-submit">
              Create Admin
            </button>
            <p class="feedback-note admin-signup-public-feedback" id="admin-signup-feedback" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>

    <script src="/theme.js?v=scoped-admin-nav-theme-1"></script>
    <script src="/admin_signup.js?v=store-type-dropdown-1"></script>
  </body>
</html>
