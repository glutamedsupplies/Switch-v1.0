<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reset Switch PIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/switch_pin_reset.css?v=pin-reset-1" />
  </head>
  <body class="pin-reset-page">
    <main class="pin-reset">
      <p class="pin-reset__mark">Switch</p>
      <section class="pin-reset__card" data-pin-reset-card>
        <p class="pin-reset__kicker">Forgot Switch PIN</p>
        <h1 data-pin-reset-title>Open the reset from Gmail</h1>
        <p class="pin-reset__lead" data-pin-reset-lead>Checking your reset link…</p>
        <form data-pin-reset-form hidden>
          <label data-pin-reset-password-field>
            <span>Company password</span>
            <input type="password" autocomplete="current-password" data-pin-reset-password />
          </label>
          <div data-pin-reset-pin-fields hidden>
            <label>
              <span>New Switch PIN</span>
              <input type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-pin-reset-pin />
            </label>
            <label>
              <span>Confirm Switch PIN</span>
              <input type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-pin-reset-pin-confirm />
            </label>
          </div>
          <p class="pin-reset__feedback" data-pin-reset-feedback aria-live="polite"></p>
          <button type="submit" data-pin-reset-submit>Continue</button>
        </form>
      </section>
    </main>
    <script src="/switch_pin_reset.js?v=pin-reset-1"></script>
  </body>
</html>
