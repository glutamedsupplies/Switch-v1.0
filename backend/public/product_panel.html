<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Product Listing…</title>
  </head>
  <body>
    <p>Opening Product Listing…</p>
    <script>
      const sourceUrl = new URL(window.location.href);
      const targetUrl = new URL("/main.html", window.location.origin);
      sourceUrl.searchParams.forEach((value, key) => {
        if (key !== "__gms_admin_spa_frame") {
          targetUrl.searchParams.append(key, value);
        }
      });
      if (!targetUrl.searchParams.has("product") && targetUrl.searchParams.has("productId")) {
        targetUrl.searchParams.set("product", targetUrl.searchParams.get("productId"));
        targetUrl.searchParams.delete("productId");
      }
      targetUrl.hash = "listing";
      const destination = `${targetUrl.pathname}${targetUrl.search}${targetUrl.hash}`;
      if (window.parent !== window) {
        window.parent.location.replace(destination);
      } else {
        window.location.replace(destination);
      }
    </script>
    <noscript><a href="/main.html#listing">Open Product Listing</a></noscript>
  </body>
</html>
