<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMS Unity Product Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          radial-gradient(circle at 50% 32%, rgba(56, 189, 248, 0.3), transparent 42%),
          #0f172a;
        background-size: 34px 34px, 34px 34px, auto, auto;
        color: #f8fafc;
      }

      #unity-container,
      #unity-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        display: block;
        background: transparent;
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
        padding: 18px;
      }

      .fallback[hidden] {
        display: none;
      }

      .fallback__preview {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .fallback__frame {
        min-width: 0;
        min-height: 78px;
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(34, 197, 94, 0.12)),
          rgba(15, 23, 42, 0.72);
        background-position: center;
        background-size: cover;
        overflow: hidden;
      }

      .fallback__message {
        margin: 0;
        padding: 10px 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.78);
        color: rgba(248, 250, 252, 0.88);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
      }

      .progress {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }

      .progress[hidden] {
        display: none;
      }

      .progress span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #38bdf8;
        transition: width 180ms ease;
      }
    </style>
  <script src="/lazy-loading.js?v=global-lazy-1"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div class="fallback" id="fallback">
      <div class="fallback__preview" id="fallback-preview"></div>
      <p class="fallback__message" id="fallback-message">
        Unity WebGL build is not installed yet. Export the Unity project here:
        /unity/product-viewer/Build/ProductViewer.loader.js
      </p>
    </div>
    <div class="progress" id="progress" hidden>
      <span id="progress-bar"></span>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const modelUrl = params.get("modelUrl") || "";
      let frameUrls = [];

      try {
        frameUrls = JSON.parse(params.get("frames") || "[]");
      } catch (_) {
        frameUrls = [];
      }

      const fallback = document.getElementById("fallback");
      const fallbackPreview = document.getElementById("fallback-preview");
      const fallbackMessage = document.getElementById("fallback-message");
      const progress = document.getElementById("progress");
      const progressBar = document.getElementById("progress-bar");
      const canvas = document.getElementById("unity-canvas");

      function renderFrameFallback() {
        fallbackPreview.innerHTML = "";
        const urls = frameUrls.slice(0, 6);
        for (let index = 0; index < 6; index += 1) {
          const frame = document.createElement("div");
          frame.className = "fallback__frame";
          if (urls[index]) {
            frame.style.backgroundImage = `url("${String(urls[index]).replace(/"/g, '\\"')}")`;
          }
          fallbackPreview.appendChild(frame);
        }
      }

      function showFallback(message) {
        fallback.hidden = false;
        progress.hidden = true;
        fallbackMessage.textContent = message;
        renderFrameFallback();
      }

      function sendProductPayloadToUnity(unityInstance) {
        const payload = JSON.stringify({
          modelUrl,
          frames: frameUrls,
        });

        try {
          unityInstance.SendMessage("ProductViewerBridge", "LoadProductJson", payload);
        } catch (_) {
          // The Unity scene can add ProductViewerBridge later; the host stays usable either way.
        }
      }

      async function loadUnityBuildConfig() {
        try {
          const response = await fetch("unity-build.json", { cache: "no-store" });
          if (response.ok) {
            return await response.json();
          }
        } catch (_) {}

        return {
          loaderUrl: "Build/ProductViewer.loader.js",
          dataUrl: "Build/ProductViewer.data",
          frameworkUrl: "Build/ProductViewer.framework.js",
          codeUrl: "Build/ProductViewer.wasm",
        };
      }

      async function bootUnity() {
        renderFrameFallback();
        const config = await loadUnityBuildConfig();
        const loaderUrl = config.loaderUrl || "Build/ProductViewer.loader.js";
        const loaderResponse = await fetch(loaderUrl, { method: "HEAD", cache: "no-store" });
        if (!loaderResponse.ok) {
          showFallback(
            "Unity WebGL build is not installed yet. Export the Unity viewer to /unity/product-viewer/Build, then refresh.",
          );
          return;
        }

        progress.hidden = false;
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          if (typeof createUnityInstance !== "function") {
            showFallback("Unity loader was found, but createUnityInstance is unavailable.");
            return;
          }

          createUnityInstance(
            canvas,
            {
              dataUrl: config.dataUrl,
              frameworkUrl: config.frameworkUrl,
              codeUrl: config.codeUrl,
              streamingAssetsUrl: config.streamingAssetsUrl || "StreamingAssets",
              companyName: config.companyName || "GMS",
              productName: config.productName || "Product Viewer",
              productVersion: config.productVersion || "1.0",
            },
            (value) => {
              progressBar.style.width = `${Math.round(value * 100)}%`;
            },
          )
            .then((unityInstance) => {
              fallback.hidden = true;
              progress.hidden = true;
              sendProductPayloadToUnity(unityInstance);
            })
            .catch((error) => {
              showFallback(error?.message || "Unable to start the Unity WebGL viewer.");
            });
        };
        script.onerror = () => {
          showFallback("Unable to load the Unity WebGL loader.");
        };
        document.body.appendChild(script);
      }

      bootUnity().catch((error) => {
        showFallback(error?.message || "Unable to initialize the Unity viewer.");
      });
    </script>
  </body>
</html>
