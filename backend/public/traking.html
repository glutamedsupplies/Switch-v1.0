<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking System</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQnnU5ToR5yojUdsx3grn8izn1HRf9s="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css?v=admin-employee-nav-restore-1" />
    <script src="/employee_access_guard.js?v=admin-session-bypass-1" data-employee-access-guard data-allowed-positions="packing"></script>
  </head>
  <body class="packing-dashboard-page traking-page">
    <main class="page-shell dashboard-shell dashboard-shell--panel-nav dashboard-shell--line-neutral">
      <div class="dashboard-layout">
        <aside class="panel dashboard-sidebar">
          <a
            class="dashboard-sidebar__logo"
            href="/packing_dashboard.html"
            aria-label="Packing dashboard home"
            title="Packing dashboard"
            data-login-logo
          >
            <span class="dashboard-sidebar__logo-mark" aria-hidden="true">
              <img
                class="dashboard-sidebar__logo-image"
                alt="Packing logo"
                hidden
                data-logo-image
              />
              <span class="dashboard-sidebar__logo-placeholder" data-logo-placeholder>
                logo
              </span>
            </span>
          </a>

          <nav class="dashboard-nav" aria-label="Packing navigation">
            <a
              class="dashboard-nav__item"
              href="/packing_dashboard.html"
              aria-label="Packing dashboard"
              title="Packing dashboard"
            >
              <span class="dashboard-nav__icon dashboard-nav__icon--packing-box" aria-hidden="true">
                <svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
                  <path d="M180-80q-24.75 0-42.37-17.63Q120-115.25 120-140v-483q-17-6-28.5-21.39T80-680v-140q0-24.75 17.63-42.38Q115.25-880 140-880h680q24.75 0 42.38 17.62Q880-844.75 880-820v140q0 20.22-11.5 35.61T840-623v483q0 24.75-17.62 42.37Q804.75-80 780-80H180Zm0-540v480h600v-480H180Zm-40-60h680v-140H140v140Zm250 260h180q12.75 0 21.38-8.68 8.62-8.67 8.62-21.5 0-12.82-8.62-21.32-8.63-8.5-21.38-8.5H390q-12.75 0-21.37 8.68-8.63 8.67-8.63 21.5 0 12.82 8.63 21.32 8.62 8.5 21.37 8.5Zm90 40Z" />
                </svg>
              </span>
              <span class="dashboard-nav__label">Packing</span>
            </a>

            <a
              class="dashboard-nav__item is-active"
              href="/traking.html"
              aria-current="page"
              aria-label="Tracking system"
              title="Tracking system"
            >
              <span class="dashboard-nav__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M4.5 18.5c2.6-2.5 5.1-2.5 7.5 0s4.9 2.5 7.5 0" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M6.5 13.2C5.1 11.4 4.4 9.9 4.4 8.6a4.1 4.1 0 0 1 8.2 0c0 1.3-.7 2.8-2.1 4.6L8.5 16l-2-2.8Z" stroke-linejoin="round" />
                  <circle cx="8.5" cy="8.6" r="1.25" />
                  <path d="M15 5.5h4.5v4.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="m14.5 10.5 5-5" stroke-linecap="round" />
                </svg>
              </span>
              <span class="dashboard-nav__label">Tracking</span>
            </a>

            <a
              class="dashboard-nav__item dashboard-nav__item--sign-out"
              href="/login.html?role=employee"
              aria-label="Log out"
              title="Log out"
              data-employee-sign-out
            >
              <span class="dashboard-nav__icon" aria-hidden="true">
                <svg viewBox="0 -960 960 960" fill="none" aria-hidden="true">
                  <path d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h269q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H180v600h269q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H180Zm545-330H390q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h333l-81-81q-9-9-8.5-21t9.5-21q9-9 21.5-9t21.5 9l133 133q9 9 9 21t-9 21L687-326q-8.8 9-20.9 8.5-12.1-.5-21.49-9.5-8.61-9-8.61-21.5t9-21.5l80-80Z" fill="currentColor" />
                </svg>
              </span>
              <span class="dashboard-nav__label">Log out</span>
            </a>
          </nav>
        </aside>

        <div class="dashboard-content">
          <section class="hero hero--sticky">
            <div class="hero-actions">
              <div>
                <h1>Tracking System</h1>
              </div>

              <div class="dashboard-hero-tools">
                <button
                  type="button"
                  class="dashboard-tool-button tracking-refresh-button"
                  data-tracking-refresh
                  aria-label="Refresh tracking"
                  title="Refresh tracking"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M20 12a8 8 0 0 1-13.5 5.8" stroke-linecap="round" />
                    <path d="M4 12A8 8 0 0 1 17.5 6.2" stroke-linecap="round" />
                    <path d="M17.5 3.5v2.7h-2.8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M6.5 20.5v-2.7h2.8" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
            </div>
          </section>

          <section class="tracking-page-grid" data-tracking-app>
            <section class="tracking-workspace" aria-label="Tracking workspace">
              <section class="panel dashboard-panel tracking-orders-panel">
                <div class="panel-heading tracking-panel-heading">
                  <div>
                    <h2>Shipments</h2>
                  </div>
                  <span class="count-pill" data-tracking-order-count>0 orders</span>
                </div>

                <label
                  class="product-panel-toolbar__search tracking-search"
                  aria-label="Search tracking shipments"
                >
                  <span class="product-panel-toolbar__search-icon tracking-search__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                      <circle cx="11" cy="11" r="6.5" />
                      <path d="m16 16 4 4" stroke-linecap="round" />
                    </svg>
                  </span>
                  <input
                    type="search"
                    data-tracking-search
                    placeholder="Search order, customer, address..."
                    autocomplete="off"
                  />
                </label>

                <div class="tracking-filter-tabs" aria-label="Filter shipments">
                  <button type="button" class="tracking-filter-tabs__button is-active" data-tracking-filter="all" aria-pressed="true">All</button>
                  <button type="button" class="tracking-filter-tabs__button" data-tracking-filter="packing" aria-pressed="false">Packing</button>
                  <button type="button" class="tracking-filter-tabs__button" data-tracking-filter="ready" aria-pressed="false">Ready</button>
                  <button type="button" class="tracking-filter-tabs__button" data-tracking-filter="route" aria-pressed="false">Route</button>
                  <button type="button" class="tracking-filter-tabs__button" data-tracking-filter="done" aria-pressed="false">Done</button>
                </div>

                <div class="tracking-order-list" data-tracking-order-list>
                  <div class="empty-state">Loading shipments...</div>
                </div>
              </section>

              <section class="panel dashboard-panel tracking-map-panel">
                <div class="panel-heading tracking-panel-heading">
                  <div>
                    <p class="section-label" data-tracking-map-kicker>Route</p>
                    <h2 data-tracking-map-title>Map</h2>
                  </div>
                  <span class="status-pill" data-tracking-map-status>Loading</span>
                </div>

                <div class="tracking-map-shell">
                  <iframe
                    class="tracking-google-map"
                    data-tracking-google-map
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3861.123456789!2d120.9842195!3d14.5995124!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397ca3c1a3b1fbf%3A0x9c2d3b456789!2sManila!5e0!3m2!1sen!2sph!4v1700000000000!5m2!1sen!2sph"
                    width="100%"
                    height="450"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    aria-label="Google Maps shipment location"
                  ></iframe>
                  <div
                    class="tracking-leaflet-map"
                    data-tracking-leaflet-map
                    aria-label="OpenStreetMap shipment route"
                  ></div>
                  <svg
                    class="tracking-map tracking-map--fallback"
                    data-tracking-map
                    viewBox="0 0 1000 560"
                    role="img"
                    aria-label="Shipment route map"
                  ></svg>
                </div>

                <div class="tracking-map-readout">
                  <span data-tracking-map-origin>GMS Packing Hub</span>
                  <span class="tracking-map-readout__divider" aria-hidden="true"></span>
                  <span data-tracking-map-destination>Destination</span>
                </div>
              </section>

              <section class="panel dashboard-panel tracking-detail-panel">
                <div class="panel-heading tracking-panel-heading">
                  <div>
                    <h2>Details</h2>
                  </div>
                  <span class="status-pill" data-tracking-detail-status>Pending</span>
                </div>

                <dl class="tracking-detail-list">
                  <div>
                    <dt>Order</dt>
                    <dd data-tracking-detail-order>-</dd>
                  </div>
                  <div>
                    <dt>Courier</dt>
                    <dd data-tracking-detail-courier>-</dd>
                  </div>
                  <div>
                    <dt>Customer</dt>
                    <dd data-tracking-detail-customer>-</dd>
                  </div>
                  <div>
                    <dt>Address</dt>
                    <dd data-tracking-detail-address>-</dd>
                  </div>
                  <div>
                    <dt>Items</dt>
                    <dd data-tracking-detail-items>-</dd>
                  </div>
                </dl>

                <div class="tracking-timeline" data-tracking-timeline></div>
              </section>
            </section>
          </section>
        </div>
      </div>
    </main>

    <script src="/theme.js?v=scoped-admin-nav-theme-1"></script>
    <script src="/employee_sign_out.js?v=employee-login-history-1"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/traking.js?v=search-delay-500-1"></script>
  </body>
</html>
