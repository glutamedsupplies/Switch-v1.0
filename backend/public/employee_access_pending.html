<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pending Access</title>
    <link rel="stylesheet" href="/styles.css?v=admin-employee-nav-restore-1" />
  </head>
  <body>
    <main class="page-shell dashboard-shell dashboard-shell--panel-nav dashboard-shell--line-neutral employee-access-pending-shell">
      <div class="dashboard-layout">
        <aside class="panel dashboard-sidebar">
          <a
            class="dashboard-sidebar__logo"
            href="/employee_access_pending.html"
            aria-label="Employee access status"
            title="Employee access status"
            data-login-logo
          >
            <span class="dashboard-sidebar__logo-mark" aria-hidden="true">
              <img
                class="dashboard-sidebar__logo-image"
                alt="Employee logo"
                hidden
                data-logo-image
              />
              <span class="dashboard-sidebar__logo-placeholder" data-logo-placeholder>
                logo
              </span>
            </span>
          </a>

          <nav class="dashboard-nav" aria-label="Employee navigation">
            <a
              class="dashboard-nav__item is-active"
              href="/employee_access_pending.html"
              aria-current="page"
              aria-label="Access status"
              title="Access status"
            >
              <span class="dashboard-nav__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M7.5 10V8.1a4.5 4.5 0 0 1 9 0V10" stroke-linecap="round" />
                  <rect x="5.5" y="10" width="13" height="9.5" rx="2.4" />
                  <path d="M12 14v2.3" stroke-linecap="round" />
                </svg>
              </span>
              <span class="dashboard-nav__label">Workspace</span>
            </a>

            <a
              class="dashboard-nav__item dashboard-nav__item--sign-out"
              href="/login.html?role=employee"
              aria-label="Sign out"
              title="Sign out"
              hidden
              aria-hidden="true"
              data-employee-sign-out
            >
              <span class="dashboard-nav__icon" aria-hidden="true">
                <svg viewBox="0 -960 960 960" fill="none" aria-hidden="true">
                  <path d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h269q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H180v600h269q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H180Zm545-330H390q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h333l-81-81q-9-9-8.5-21t9.5-21q9-9 21.5-9t21.5 9l133 133q9 9 9 21t-9 21L687-326q-8.8 9-20.9 8.5-12.1-.5-21.49-9.5-8.61-9-8.61-21.5t9-21.5l80-80Z" fill="currentColor" />
                </svg>
              </span>
              <span class="dashboard-nav__label">Sign Out</span>
            </a>
          </nav>
        </aside>

        <div class="dashboard-content">
          <section class="hero employee-access-pending-hero">
            <div class="hero-actions">
              <div>
                <h1 data-access-pending-heading>Pending Access</h1>
              </div>
              <div class="product-panel-toolbar__profile" aria-label="Employee workspace summary">
                <span
                  class="product-panel-toolbar__avatar"
                  aria-hidden="true"
                  data-login-logo
                >
                  <img
                    class="product-panel-toolbar__avatar-image"
                    alt="Employee logo"
                    hidden
                    data-logo-image
                  />
                  <span class="product-panel-toolbar__avatar-placeholder" data-logo-placeholder>
                    EM
                  </span>
                </span>
                <span class="product-panel-toolbar__profile-copy">
                  <strong>Employee Workspace</strong>
                  <span>Pending Access</span>
                </span>
              </div>
            </div>
          </section>

          <section class="panel dashboard-panel employee-access-pending-panel">
            <div class="employee-access-pending-card">
              <span class="employee-access-pending-card__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 3.5 20 7v5.4c0 4.4-3.1 7.1-8 8.1-4.9-1-8-3.7-8-8.1V7l8-3.5Z" stroke-linejoin="round" />
                  <path d="M8.8 12.4 11 14.6l5.1-5.2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>

              <div class="employee-access-pending-card__body">
                <h2>Waiting for admin to give access</h2>
                <p>
                  Your account was created, but this position does not have an assigned dashboard yet.
                </p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/theme.js?v=scoped-admin-nav-theme-1"></script>
    <script src="/settings-menu.js?v=workspace-default-icon-1"></script>
    <script src="/employee_sign_out.js?v=employee-login-history-1"></script>
    <script src="/employee_access_pending.js?v=pending-access-copy-1"></script>
  </body>
</html>
