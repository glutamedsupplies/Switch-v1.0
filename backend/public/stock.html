<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Inventory…</title>
  </head>
  <body>
    <p>Opening Inventory…</p>
    <script>
      const sourceUrl = new URL(window.location.href);
      const targetUrl = new URL("/main.html", window.location.origin);
      sourceUrl.searchParams.forEach((value, key) => {
        if (key !== "__gms_admin_spa_frame") {
          targetUrl.searchParams.append(key, value);
        }
      });
      targetUrl.hash = "inventory";
      const destination = `${targetUrl.pathname}${targetUrl.search}${targetUrl.hash}`;
      if (window.parent !== window) {
        window.parent.location.replace(destination);
      } else {
        window.location.replace(destination);
      }
    </script>
    <noscript><a href="/main.html#inventory">Open Inventory</a></noscript>
  </body>
</html>
