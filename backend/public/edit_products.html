<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product</title>
    <link rel="stylesheet" href="/styles.css?v=universal-search-1" />
  </head>
  <body data-product-editor-page="standalone">
    <main class="page-shell product-editor-shell">
      <section class="panel product-panel-grid__form product-editor-form">
        <div class="panel-heading product-panel-grid__form-heading">
          <div>
            <h2 id="form-title"></h2>
          </div>
          <button
            type="submit"
            class="product-editor-submit-button"
            id="submit-button"
            form="product-form"
          >
            Update Product
          </button>
        </div>

        <form id="product-form" class="product-form">
          <div class="product-form-layout">
            <div class="product-form-layout__media">
              <div
                id="product-editor-section-media"
                class="product-form-section-card product-form-section-card--media product-form-section-anchor"
              >
                <div class="product-form-section-carousel" aria-label="Product editor sections">
                  <button
                    type="button"
                    class="product-form-section-carousel__button is-active"
                    data-product-editor-section-target="product-editor-section-photo"
                    aria-controls="product-editor-section-photo"
                    aria-pressed="true"
                  >
                    Photo
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-video"
                    aria-controls="product-editor-section-video"
                    aria-pressed="false"
                  >
                    Video
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-details"
                    aria-controls="product-editor-section-details"
                    aria-pressed="false"
                  >
                    Product Details
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-variants"
                    aria-controls="product-editor-section-variants"
                    aria-pressed="false"
                  >
                    Variant
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-barcode"
                    aria-controls="product-editor-section-barcode"
                    aria-pressed="false"
                  >
                    Barcode
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-image-search"
                    aria-controls="product-editor-section-image-search"
                    aria-pressed="false"
                  >
                    Image Search
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-3d-model"
                    aria-controls="product-editor-section-3d-model"
                    aria-pressed="false"
                  >
                    3D Model
                  </button>
                </div>

                <div
                  id="product-editor-section-photo"
                  class="product-image-upload-group product-form-section-anchor"
                >
                  <div id="product-image-input-list" class="product-image-input-list"></div>

                  <div class="product-image-upload-group__footer">
                    <button
                      type="button"
                      class="product-image-upload-group__add-button product-image-upload-group__add-button--filled"
                      id="add-image-input-button"
                      aria-label="Add image"
                      title="Add image"
                    >
                      <span class="product-image-upload-group__add-plus" aria-hidden="true">+</span>
                      <span>Add Image</span>
                    </button>
                  </div>

                </div>

                <div
                  id="product-editor-section-video"
                  class="product-image-upload-group product-video-upload-group product-form-section-anchor"
                >
                  <div
                    id="product-video-input-list"
                    class="product-image-input-list product-video-input-list"
                  ></div>

                  <div class="product-image-upload-group__footer">
                    <button
                      type="button"
                      class="product-image-upload-group__add-button product-image-upload-group__add-button--filled"
                      id="add-video-input-button"
                      aria-label="Add video"
                      title="Add video"
                    >
                      <span class="product-image-upload-group__add-plus" aria-hidden="true">+</span>
                      <span>Add Video</span>
                    </button>
                  </div>

                </div>
                <div
                  id="product-editor-section-details"
                  class="product-form-section-panel product-form-section-anchor"
                >
                  <div class="product-form-details-stack">
                    <div
                      class="product-category-selected-chips"
                      id="selected-category-chips"
                      hidden
                    ></div>
                    <div class="form-grid">
                      <label>
                        Product Name
                        <input
                          type="text"
                          name="name"
                          placeholder="Enter product name"
                          required
                        />
                      </label>

                      <label>
                        Category
                        <div class="product-category-multiselect" id="product-category-multiselect">
                          <input type="hidden" name="category" id="category-select" required />
                          <button
                            type="button"
                            class="product-category-multiselect__trigger"
                            id="product-category-trigger"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                          >
                            <span
                              class="product-category-multiselect__summary"
                              id="product-category-summary"
                            >
                              Select categories
                            </span>
                            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                          </button>
                          <div
                            class="product-category-multiselect__menu"
                            id="product-category-menu"
                            role="listbox"
                            aria-multiselectable="true"
                            hidden
                          ></div>
                        </div>
                      </label>
                    </div>

                    <div class="form-grid form-grid--triple">
                      <label>
                        Original Price
                        <input
                          type="number"
                          name="originalPrice"
                          min="0"
                          step="0.01"
                          placeholder="0.00"
                          required
                        />
                      </label>

                      <label>
                        Sales Price
                        <input
                          type="number"
                          name="salesPrice"
                          min="0"
                          step="0.01"
                          placeholder="0.00"
                        />
                      </label>

                      <label>
                        Stock
                        <input
                          type="number"
                          name="stock"
                          min="0"
                          step="1"
                          placeholder="0"
                          required
                        />
                      </label>
                    </div>

                    <label>
                      About this product
                      <textarea
                        name="description"
                        rows="7"
                        placeholder="Write about this product"
                        required
                      ></textarea>
                    </label>
                  </div>
                </div>
                <div
                  id="product-editor-section-barcode"
                  class="product-form-section-panel product-form-section-anchor"
                  hidden
                >
                  <div class="product-form-details-stack">
                    <div class="form-grid">
                      <label class="visually-hidden" for="product-barcode-input">
                        Product Barcode
                      </label>
                      <input
                        type="text"
                        name="barcode"
                        id="product-barcode-input"
                        class="barcode-hidden-input"
                        autocomplete="off"
                      />
                    </div>
                   
                    <div id="barcode-scan-prompt" class="barcode-scan-prompt">
                      Barcode scan active. Scan a barcode now to generate the image.
                    </div>
                    <div id="barcode-preview-container" class="barcode-preview-container" hidden></div>
                    <label class="barcode-packing-checkbox" hidden>
                      <input type="checkbox" name="moveBarcodeToPackingDashboard" />
                      <span>Move to packing dashboard</span>
                    </label>
                  </div>
                </div>
                <div
                  id="product-editor-section-image-search"
                  class="product-form-section-panel product-form-section-anchor"
                  hidden
                >
                  <div class="product-form-details-stack">
                    <div class="visual-search-registration">
                      <p class="visual-search-registration__hint">
                        Capture image
                      </p>
                      <div
                        id="visual-search-preview-container"
                        class="visual-search-preview-container visual-search-angle-grid"
                      ></div>
                    </div>
                  </div>
                </div>
                <div
                  id="product-editor-section-3d-model"
                  class="product-form-section-panel product-form-section-anchor"
                  hidden
                >
                  <div class="product-form-details-stack">
                    <div class="product-model-registration">
                      <div
                        id="product-model-viewer"
                        class="product-model-registration__viewer"
                        role="img"
                        aria-label="3D model preview"
                        tabindex="0"
                      >
                        <div
                          id="product-model-cube"
                          class="product-model-registration__cube"
                          aria-hidden="true"
                        >
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--front"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--back"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--right"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--left"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--top"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--bottom"></span>
                        </div>
                        <div class="product-model-registration__scan-ring" aria-hidden="true"></div>
                      </div>

                      <div class="product-model-registration__content">
                        <div class="product-model-registration__carousel" id="product-model-carousel">
                          <p class="product-model-registration__title">Upload a ready 3D product file.</p>
                          <p class="product-model-registration__copy" id="product-model-status">
                            Choose a .glb file, then save the product to register it.
                          </p>
                        </div>

                        <div class="product-model-registration__actions">
                          <button
                            type="button"
                            class="product-model-registration__action product-model-registration__action--primary"
                            id="product-model-upload-button"
                          >
                            <i class="fa-solid fa-upload" aria-hidden="true"></i>
                            <span>Upload GLB</span>
                          </button>
                          <button
                            type="button"
                            class="product-model-registration__action product-model-registration__action--danger"
                            id="product-model-remove-button"
                            hidden
                          >
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            <span>Remove</span>
                          </button>
                          <input
                            id="product-model-file-input"
                            type="file"
                            accept=".glb,model/gltf-binary,application/octet-stream"
                            hidden
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div
                  id="product-editor-section-variants"
                  class="product-form-section-panel product-form-section-anchor"
                >
                  <div class="product-variant-group">
                    <div id="product-variant-list" class="product-variant-list"></div>

                    <div class="product-image-upload-group__footer">
                      <button
                        type="button"
                        class="product-image-upload-group__add-button product-image-upload-group__add-button--filled"
                        id="add-variant-button"
                        aria-label="Add variant"
                        title="Add variant"
                      >
                        <span class="product-image-upload-group__add-plus" aria-hidden="true">+</span>
                        <span>Add Variant</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="product-form-layout__details">
              <div class="product-form-section-card product-form-section-card--app-preview">
                <div class="product-composer-preview__header android-preview-toolbar">
                  <div class="android-preview-theme-switcher" aria-label="Android preview theme">
                    <button
                      type="button"
                      class="product-form-section-carousel__button android-preview-theme-button is-active"
                      data-android-preview-theme="light"
                      aria-pressed="true"
                    >
                      Light Mode
                    </button>
                    <button
                      type="button"
                      class="product-form-section-carousel__button android-preview-theme-button"
                      data-android-preview-theme="dark"
                      aria-pressed="false"
                    >
                      Dark Mode
                    </button>
                  </div>
                </div>
                <div
                  id="android-preview-stage"
                  class="android-preview-stage"
                  aria-live="polite"
                ></div>
              </div>
            </div>
          </div>

        </form>

        <p class="helper-text" id="helper-text">
          Open this page from the Products list so the selected item loads here for editing.
        </p>
      </section>
    </main>

    <script src="/theme.js?v=scoped-admin-nav-theme-1"></script>
    <script src="/app.js?v=product-scope-isolation-1"></script>
  </body>
</html>
