<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Listing</title>
    <link rel="stylesheet" href="/styles.css?v=snackbar-oneline-1" />
    <link rel="stylesheet" href="/main.css?v=admin-seller-table-headers-main-only-1" />
  <script src="/lazy-loading.js?v=global-lazy-1"></script>
  </head>
  <body data-product-editor-page="standalone">
    <main class="page-shell product-editor-shell">
      <section class="panel product-panel-grid__form product-editor-form">
        <div class="panel-heading product-panel-grid__form-heading">
          <div>
            <h2 id="form-title">Edit Listing</h2>
          </div>
          <button
            type="submit"
            class="product-editor-submit-button"
            id="submit-button"
            form="product-form"
          >
            Update Listing
          </button>
        </div>

        <form id="product-form" class="product-form">
          <div class="product-form-layout">
            <div class="product-form-layout__media">
              <div
                id="product-editor-section-media"
                class="product-form-section-card product-form-section-card--media product-form-section-anchor"
              >
                <div class="product-form-section-carousel" aria-label="Product editor sections">
                  <button
                    type="button"
                    class="product-form-section-carousel__button is-active"
                    data-product-editor-section-target="product-editor-section-photo"
                    aria-controls="product-editor-section-photo"
                    aria-pressed="true"
                  >
                    Photo
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-video"
                    aria-controls="product-editor-section-video"
                    aria-pressed="false"
                  >
                    Video
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-details"
                    aria-controls="product-editor-section-details"
                    aria-pressed="false"
                  >
                    Product Details
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-variants"
                    aria-controls="product-editor-section-variants"
                    aria-pressed="false"
                  >
                    Variant
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-barcode"
                    aria-controls="product-editor-section-barcode"
                    aria-pressed="false"
                  >
                    Barcode
                  </button>
                  <button
                    type="button"
                    class="product-form-section-carousel__button"
                    data-product-editor-section-target="product-editor-section-3d-model"
                    aria-controls="product-editor-section-3d-model"
                    aria-pressed="false"
                  >
                    3D Model
                  </button>
                </div>

                <div
                  id="product-editor-section-photo"
                  class="product-image-upload-group product-form-section-anchor"
                >
                  <div id="product-image-input-list" class="product-image-input-list"></div>

                  <div class="product-image-upload-group__footer">
                    <button
                      type="button"
                      class="product-image-upload-group__add-button product-image-upload-group__add-button--filled"
                      id="add-image-input-button"
                      aria-label="Add image"
                      title="Add image"
                    >
                      <span class="product-image-upload-group__add-plus" aria-hidden="true">+</span>
                      <span>Add Image</span>
                    </button>
                  </div>

                </div>

                <div
                  id="product-editor-section-video"
                  class="product-image-upload-group product-video-upload-group product-form-section-anchor"
                >
                  <div class="product-editor-section-header">
                    <h3 class="product-editor-section-title">Video</h3>
                    <a
                      href="/main.html"
                      class="product-section-home-button"
                      aria-label="Go to home"
                      title="Home"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
                        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                      </svg>
                    </a>
                  </div>
                  <div
                    id="product-video-input-list"
                    class="product-image-input-list product-video-input-list"
                  ></div>

                  <div class="product-image-upload-group__footer">
                    <button
                      type="button"
                      class="product-image-upload-group__add-button product-image-upload-group__add-button--filled"
                      id="add-video-input-button"
                      aria-label="Add video"
                      title="Add video"
                    >
                      <span class="product-image-upload-group__add-plus" aria-hidden="true">+</span>
                      <span>Add Video</span>
                    </button>
                  </div>

                </div>
                <div
                  id="product-editor-section-details"
                  class="product-form-section-panel product-form-section-anchor"
                >
                  <div class="product-form-details-stack">
                    <div
                      class="product-category-selected-chips"
                      id="selected-category-chips"
                      hidden
                    ></div>
                    <div class="form-grid">
                      <label>
                        Product Name
                        <input
                          type="text"
                          name="name"
                          maxlength="150"
                          placeholder="Enter product name"
                          aria-describedby="listing-name-character-limit"
                          required
                        />
                        <small
                          class="product-field-limit"
                          id="listing-name-character-limit"
                          data-product-name-character-count
                        >0 / 150 characters</small>
                      </label>

                      <label>
                        Category
                        <div class="product-category-multiselect" id="product-category-multiselect">
                          <input type="hidden" name="category" id="category-select" required />
                          <button
                            type="button"
                            class="product-category-multiselect__trigger"
                            id="product-category-trigger"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                          >
                            <span
                              class="product-category-multiselect__summary"
                              id="product-category-summary"
                            >
                              Select categories
                            </span>
                            <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12" aria-hidden="true"><path d="M12 16.5 5.2 8.8c-.35-.4-.06-1.05.47-1.05h12.66c.53 0 .82.65.47 1.05L12 16.5Z"/></svg>
                          </button>
                          <div
                            class="product-category-multiselect__menu"
                            id="product-category-menu"
                            role="listbox"
                            aria-multiselectable="true"
                            hidden
                          ></div>
                        </div>
                      </label>
                    </div>

                    <div class="form-grid form-grid--triple product-details-metrics-grid">
                      <label>
                        Original Price
                        <input
                          type="number"
                          name="originalPrice"
                          min="0"
                          max="500000"
                          step="0.01"
                          placeholder="0.00"
                          aria-describedby="listing-original-price-limit"
                          required
                        />
                        <small class="product-field-limit" id="listing-original-price-limit">Maximum ₱500,000</small>
                      </label>

                      <label>
                        Sales Price
                        <input
                          type="number"
                          name="salesPrice"
                          min="0"
                          max="500000"
                          step="0.01"
                          placeholder="0.00"
                          aria-describedby="listing-sales-price-limit"
                        />
                        <small class="product-field-limit" id="listing-sales-price-limit">Maximum ₱500,000</small>
                      </label>

                      <label>
                        Stock
                        <input
                          type="number"
                          name="stock"
                          min="0"
                          step="1"
                          placeholder="0"
                          required
                        />
                      </label>
                    </div>

                    <div class="form-grid form-grid--triple product-partner-selection" data-product-partner-selection>
                      <fieldset class="product-partner-selection__group" data-product-partner-group="delivery">
                        <legend>Delivery Partner</legend>
                        <div class="product-partner-selection__dropdown" data-product-partner-dropdown="delivery">
                          <button
                            type="button"
                            class="product-partner-selection__trigger"
                            data-product-partner-trigger="delivery"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                          >
                            <span class="product-partner-selection__summary is-placeholder" data-product-partner-summary="delivery">Select delivery partner</span>
                            <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12" aria-hidden="true"><path d="M12 16.5 5.2 8.8c-.35-.4-.06-1.05.47-1.05h12.66c.53 0 .82.65.47 1.05L12 16.5Z"/></svg>
                          </button>
                          <div class="product-partner-selection__list product-partner-selection__menu" data-product-partner-list="delivery" role="listbox" aria-multiselectable="true" hidden></div>
                        </div>
                        <p class="product-partner-selection__status" data-product-partner-status="delivery"></p>
                      </fieldset>

                      <fieldset class="product-partner-selection__group" data-product-partner-group="payment">
                        <legend>Payment Partner</legend>
                        <div class="product-partner-selection__dropdown" data-product-partner-dropdown="payment">
                          <button
                            type="button"
                            class="product-partner-selection__trigger"
                            data-product-partner-trigger="payment"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                          >
                            <span class="product-partner-selection__summary is-placeholder" data-product-partner-summary="payment">Select payment partner</span>
                            <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12" aria-hidden="true"><path d="M12 16.5 5.2 8.8c-.35-.4-.06-1.05.47-1.05h12.66c.53 0 .82.65.47 1.05L12 16.5Z"/></svg>
                          </button>
                          <div class="product-partner-selection__list product-partner-selection__menu" data-product-partner-list="payment" role="listbox" aria-multiselectable="true" hidden></div>
                        </div>
                        <p class="product-partner-selection__status" data-product-partner-status="payment"></p>
                      </fieldset>

                      <label>
                        Expire Date
                        <input
                          type="date"
                          name="expiryDate"
                          id="product-expiry-date-input"
                        />
                      </label>
                    </div>

                    <label>
                      About this product
                      <textarea
                        class="product-details-textarea"
                        name="description"
                        rows="7"
                        maxlength="500"
                        placeholder="Write about this product"
                        aria-describedby="listing-description-character-limit"
                        required
                      ></textarea>
                      <small
                        class="product-field-limit"
                        id="listing-description-character-limit"
                        data-product-description-character-count
                      >0 / 500 characters</small>
                    </label>
                  </div>
                </div>
                <div
                  id="product-editor-section-barcode"
                  class="product-form-section-panel product-form-section-anchor"
                  hidden
                >
                  <div class="product-form-details-stack">
                    <div class="form-grid">
                      <label class="visually-hidden" for="product-barcode-input">
                        Product Barcode
                      </label>
                      <input
                        type="text"
                        name="barcode"
                        id="product-barcode-input"
                        class="barcode-hidden-input"
                        autocomplete="off"
                      />
                    </div>

                    <div id="barcode-scan-prompt" class="barcode-scan-prompt">
                      Barcode scan active. Scan a barcode now to generate the image.
                    </div>
                    <div id="barcode-preview-container" class="barcode-preview-container" hidden></div>
                    <label class="barcode-packing-checkbox" hidden>
                      <input type="checkbox" name="moveBarcodeToPackingDashboard" />
                      <span>Move to packing dashboard</span>
                    </label>
                  </div>
                </div>
                <div
                  id="product-editor-section-3d-model"
                  class="product-form-section-panel product-form-section-anchor"
                  hidden
                >
                  <div class="product-form-details-stack">
                    <div class="product-model-registration">
                      <div
                        id="product-model-viewer"
                        class="product-model-registration__viewer"
                        role="img"
                        aria-label="3D model preview"
                        tabindex="0"
                      >
                        <div
                          id="product-model-cube"
                          class="product-model-registration__cube"
                          aria-hidden="true"
                        >
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--front"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--back"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--right"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--left"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--top"></span>
                          <span class="product-model-registration__cube-face product-model-registration__cube-face--bottom"></span>
                        </div>
                        <div class="product-model-registration__scan-ring" aria-hidden="true"></div>
                      </div>

                      <div class="product-model-registration__content">
                        <div class="product-model-registration__carousel" id="product-model-carousel">
                          <p class="product-model-registration__title">Upload a ready 3D product file.</p>
                          <p class="product-model-registration__copy" id="product-model-status">
                            Choose a .glb file, then save the product to register it.
                          </p>
                        </div>

                        <div class="product-model-registration__actions">
                          <button
                            type="button"
                            class="product-model-registration__action product-model-registration__action--primary"
                            id="product-model-upload-button"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                              <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                              <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                              <path d="M12 12v6" />
                              <path d="m15 15-3-3-3 3" />
                            </svg>
                            <span>Upload GLB</span>
                          </button>
                          <button
                            type="button"
                            class="product-model-registration__action product-model-registration__action--danger"
                            id="product-model-remove-button"
                            hidden
                          >
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            <span>Remove</span>
                          </button>
                          <input
                            id="product-model-file-input"
                            type="file"
                            accept=".glb,model/gltf-binary,application/octet-stream"
                            hidden
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div
                  id="product-editor-section-variants"
                  class="product-form-section-panel product-form-section-anchor"
                >
                  <div class="product-variant-group">
                    <div id="product-variant-list" class="product-variant-list"></div>

                    <div class="product-image-upload-group__footer">
                      <button
                        type="button"
                        class="product-image-upload-group__add-button product-image-upload-group__add-button--filled"
                        id="add-variant-button"
                        aria-label="Add variant"
                        title="Add variant"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                          <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 .83.18 2 2 0 0 0 .83-.18l8.58-3.9a1 1 0 0 0 0-1.831z" />
                          <path d="M16 17h6" />
                          <path d="M19 14v6" />
                          <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 .825.178" />
                          <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l2.116-.962" />
                        </svg>
                        <span>Add Variant</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="product-form-layout__details">
              <div class="product-form-section-card product-form-section-card--app-preview">
                <div class="product-composer-preview__header android-preview-toolbar">
                  <div class="android-preview-theme-switcher" aria-label="Android preview theme">
                    <button
                      type="button"
                      class="product-form-section-carousel__button android-preview-theme-button is-active"
                      data-android-preview-theme="light"
                      aria-pressed="true"
                    >
                      Light Mode
                    </button>
                    <button
                      type="button"
                      class="product-form-section-carousel__button android-preview-theme-button"
                      data-android-preview-theme="dark"
                      aria-pressed="false"
                    >
                      Dark Mode
                    </button>
                  </div>
                </div>
                <div
                  id="android-preview-stage"
                  class="android-preview-stage"
                  aria-live="polite"
                ></div>
              </div>
            </div>
          </div>

        </form>

        <p class="helper-text" id="helper-text"></p>
      </section>
    </main>

    <script src="/theme.js?v=platform-workspace-settings-1"></script>
    <script src="/app.js?v=stock-record-latest-quantity-1"></script>
  </body>
</html>
